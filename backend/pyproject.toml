[project]
name = "codeforge-ai-backend"
version = "0.1.0"
description = "CodeForge AI backend service"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.19,<2.0",
    "fastapi>=0.115,<1.0",
    "google-genai>=2.23,<3.0",
    "langchain>=1.4,<2.0",
    "langchain-deepseek>=1.1.1",
    "langgraph>=1.2,<2.0",
    "psycopg[binary]>=3.3,<4.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0.52,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "mypy>=1.13,<3.0",
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.8,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
