[project]
name = "codeforge-ai"
version = "0.1.0"
description = "Autonomous multi-agent software engineering system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.2",
    "fastapi>=0.141.1",
    "google-genai>=2.23.0",
    "httpx2>=2.12.0",
    "langchain>=1.4.0",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
